<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE風 オートタクティクス - 編成特化版 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .grid-board {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 2px;
            background-color: #4a5568;
            border: 4px solid #2d3748;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .cell {
            aspect-ratio: 1 / 1;
            background-color: #718096;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell.move-target { background-color: #4299e180; }
        .cell.attack-target { background-color: #f5656580; }
        
        .unit {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .unit.active { transform: scale(1.1); box-shadow: 0 0 15px #f6e05e; }
        .unit-blue { background: linear-gradient(135deg, #3182ce, #2b6cb0); border: 2px solid #63b3ed; }
        .unit-red { background: linear-gradient(135deg, #e53e3e, #c53030); border: 2px solid #fc8181; }
        
        .hp-bar-container {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #2d3748;
            border-radius: 3px;
            overflow: hidden;
        }
        .hp-bar { height: 100%; background-color: #48bb78; transition: width 0.3s ease; }
        
        .damage-text {
            position: absolute;
            top: -20px;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px black;
            animation: floatUp 1s forwards;
            pointer-events: none;
            z-index: 20;
        }
        .text-dmg { color: #fc8181; }
        .text-heal { color: #48bb78; }
        .text-crit { color: #ecc94b; font-size: 1.5rem; }
        
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2d3748; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-gray-800 p-3 shadow-md text-center z-30">
        <h1 class="text-xl font-bold text-yellow-400">FE風 オートタクティクス (編成特化 v2)</h1>
        <p class="text-xs text-gray-400 mt-1">剣(🗡️) > 斧(🪓) > 槍(🔱) > 剣(🗡️)</p>
    </header>

    <main class="flex-grow relative w-full overflow-hidden">
        
        <!-- ==================== 編成画面 ==================== -->
        <div id="prep-screen" class="absolute inset-0 bg-gray-900 overflow-y-auto p-4 flex flex-col items-center z-20">
            <div class="w-full max-w-4xl text-center mb-4 sticky top-0 bg-gray-900 pt-2 pb-4 z-10 border-b border-gray-700">
                <h2 class="text-lg font-bold text-gray-200">部隊を編成し、敵将を討て！</h2>
                <div class="mt-2 inline-block bg-gray-800 px-6 py-2 rounded-full border border-blue-500 shadow-lg">
                    <span class="text-gray-400">残りコスト:</span>
                    <span id="cost-display" class="text-3xl font-bold text-blue-400 ml-2">100</span>
                    <span class="text-gray-500 text-sm">/ 100 pt</span>
                </div>
                <p class="text-xs text-gray-400 mt-2">※ステータスは上げるほど必要コストが増加します。</p>
            </div>

            <div id="units-container" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-4 mb-20">
                <!-- JSで生成 -->
            </div>

            <div class="fixed bottom-0 w-full bg-gray-800 p-4 border-t border-gray-700 flex justify-center z-10">
                <button onclick="startGame()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-12 rounded-lg shadow-lg text-lg transition transform hover:scale-105">
                    ⚔️ 戦闘開始
                </button>
            </div>
        </div>

        <!-- ==================== 戦闘画面 ==================== -->
        <div id="battle-screen" class="hidden absolute inset-0 bg-gray-900 overflow-y-auto flex flex-col items-center p-4 z-10 pb-20">
            
            <div id="status-text" class="text-lg font-bold mb-2 text-yellow-300 h-8">戦闘準備完了</div>

            <div id="board" class="grid-board rounded-lg shadow-2xl"></div>

            <div class="w-full max-w-md mt-4 bg-gray-800 border border-gray-700 rounded-lg p-2 h-48 flex flex-col">
                <h2 class="text-sm text-gray-400 border-b border-gray-700 pb-1 mb-1">戦闘ログ</h2>
                <div id="log-panel" class="flex-grow overflow-y-auto text-sm space-y-1"></div>
            </div>

            <div id="result-controls" class="hidden mt-4 space-x-4">
                <button onclick="returnToPrep()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded shadow">
                    編成に戻る
                </button>
            </div>
        </div>

    </main>

<script>
    // --- 定数・データ ---
    const COLS = 7, ROWS = 7, SLEEP_MS = 600;
    const MAX_COST = 100;
    const BASE_HP = 20, BASE_ATK = 8, BASE_DEF = 3;

    const WEAPON_DATA = {
        sword: { name: '剣', icon: '🗡️' },
        lance: { name: '槍', icon: '🔱' },
        axe:   { name: '斧', icon: '🪓' }
    };
    
    const RANK_DATA = {
        iron:   { name: '鉄',   cost: 0,  atk: 0, desc: '標準' },
        steel:  { name: '鋼',   cost: 5,  atk: 3, desc: '威力+3' },
        killer: { name: 'キラー', cost: 10, atk: 1, desc: '威力+1 必殺(防7割減)30%' },
        brave:  { name: '勇者',   cost: 15, atk: 0, desc: '2回攻撃' }
    };

    const SKILL_DATA = {
        none:    { name: 'なし',   cost: 0,  desc: '-' },
        vantage: { name: '待ち伏せ', cost: 10, desc: '反撃時先制' },
        sol:     { name: '太陽',   cost: 15, desc: '与ダメ50%回復' },
        wrath:   { name: '怒り',   cost: 10, desc: 'HP半分以下でダメ+5' },
        pavise:  { name: '大盾',   cost: 10, desc: '30%で被ダメ半減' }
    };

    // --- ステータス・コスト計算ロジック ---
    // レベルが上がるごとに必要コストが増加する (例: +1なら1, +2なら1+2=3, +3なら1+2+3=6...)
    // HPは1レベルでHPが+2される。
    function calcStatCost(level) {
        let total = 0;
        for (let i = 1; i <= level; i++) {
            total += Math.ceil(i / 2); // 1, 1, 2, 2, 3, 3... のように緩やかに増加
        }
        return total;
    }
    
    // 次のレベルアップに必要なコストを取得
    function getNextLevelCost(level) {
        return Math.ceil((level + 1) / 2);
    }

    let playerUnits = [
        { name: '味方剣士', weaponType: 'sword', weaponRank: 'iron', skill: 'none', hpLvl: 0, atkLvl: 0, defLvl: 0 },
        { name: '味方槍兵', weaponType: 'lance', weaponRank: 'iron', skill: 'none', hpLvl: 0, atkLvl: 0, defLvl: 0 },
        { name: '味方戦士', weaponType: 'axe',   weaponRank: 'iron', skill: 'none', hpLvl: 0, atkLvl: 0, defLvl: 0 }
    ];

    let units = [];
    let isPlaying = false;
    let turnCount = 1;

    // --- 編成ロジック ---
    function calculateTotalCost() {
        let cost = 0;
        playerUnits.forEach(u => {
            cost += calcStatCost(u.hpLvl);
            cost += calcStatCost(u.atkLvl);
            cost += calcStatCost(u.defLvl);
            cost += RANK_DATA[u.weaponRank].cost;
            cost += SKILL_DATA[u.skill].cost;
        });
        return cost;
    }

    window.changeName = (idx, val) => { playerUnits[idx].name = val; };
    window.changeWt = (idx, val) => { playerUnits[idx].weaponType = val; renderPrepUI(); };
    window.changeWr = (idx, val) => {
        let old = playerUnits[idx].weaponRank;
        playerUnits[idx].weaponRank = val;
        if (calculateTotalCost() > MAX_COST) {
            alert("コスト上限を超えます！");
            playerUnits[idx].weaponRank = old;
        }
        renderPrepUI();
    };
    window.changeSkill = (idx, val) => {
        let old = playerUnits[idx].skill;
        playerUnits[idx].skill = val;
        if (calculateTotalCost() > MAX_COST) {
            alert("コスト上限を超えます！");
            playerUnits[idx].skill = old;
        }
        renderPrepUI();
    };
    window.addStat = (idx, stat, dir) => {
        const u = playerUnits[idx];
        const currentCost = calculateTotalCost();
        const remain = MAX_COST - currentCost;
        
        let targetLvl = u[`${stat}Lvl`];
        
        if (dir > 0) {
            let nextCost = getNextLevelCost(targetLvl);
            if (remain < nextCost) return; // コスト不足
            u[`${stat}Lvl`] += 1;
        } else {
            if (targetLvl <= 0) return;
            u[`${stat}Lvl`] -= 1;
        }
        renderPrepUI();
    };

    function renderPrepUI() {
        const cost = calculateTotalCost();
        const remain = MAX_COST - cost;
        const display = document.getElementById('cost-display');
        display.innerText = remain;
        display.className = `text-3xl font-bold ml-2 ${remain === 0 ? 'text-red-400' : 'text-blue-400'}`;
        
        const container = document.getElementById('units-container');
        container.innerHTML = '';
        
        playerUnits.forEach((u, i) => {
            const rData = RANK_DATA[u.weaponRank];
            const totalHp = BASE_HP + (u.hpLvl * 2);
            const totalAtk = BASE_ATK + u.atkLvl + rData.atk;
            const totalDef = BASE_DEF + u.defLvl;
            
            const nextHpCost = getNextLevelCost(u.hpLvl);
            const nextAtkCost = getNextLevelCost(u.atkLvl);
            const nextDefCost = getNextLevelCost(u.defLvl);
            
            const totalHpCost = calcStatCost(u.hpLvl);
            const totalAtkCost = calcStatCost(u.atkLvl);
            const totalDefCost = calcStatCost(u.defLvl);

            const wtBtns = Object.keys(WEAPON_DATA).map(wt => `
                <button onclick="changeWt(${i}, '${wt}')" class="px-3 py-1 rounded text-xl ${u.weaponType === wt ? 'bg-blue-600 border border-blue-300' : 'bg-gray-700 opacity-50 hover:opacity-100'}">
                    ${WEAPON_DATA[wt].icon}
                </button>
            `).join('');

            const rankOpts = Object.keys(RANK_DATA).map(rk => `
                <option value="${rk}" ${u.weaponRank === rk ? 'selected' : ''}>${RANK_DATA[rk].name} (${RANK_DATA[rk].cost}pt) ${RANK_DATA[rk].desc}</option>
            `).join('');

            const skillOpts = Object.keys(SKILL_DATA).map(sk => `
                <option value="${sk}" ${u.skill === sk ? 'selected' : ''}>${SKILL_DATA[sk].name} (${SKILL_DATA[sk].cost}pt) ${SKILL_DATA[sk].desc}</option>
            `).join('');

            container.innerHTML += `
                <div class="bg-gray-800 rounded-xl p-4 border-2 border-gray-600 flex flex-col relative">
                    <input type="text" value="${u.name}" onchange="changeName(${i}, this.value)" class="bg-gray-900 text-yellow-300 font-bold px-2 py-2 rounded w-full mb-4 text-center border border-gray-700 focus:border-blue-500 outline-none">
                    
                    <div class="flex justify-center space-x-2 mb-4">
                        ${wtBtns}
                    </div>
                    
                    <div class="mb-3">
                        <label class="text-xs text-gray-400 block mb-1">武器 (威力:+${rData.atk})</label>
                        <select onchange="changeWr(${i}, this.value)" class="w-full bg-gray-700 text-sm p-2 rounded outline-none border border-gray-600 focus:border-blue-400">
                            ${rankOpts}
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="text-xs text-gray-400 block mb-1">スキル</label>
                        <select onchange="changeSkill(${i}, this.value)" class="w-full bg-gray-700 text-sm p-2 rounded outline-none border border-gray-600 focus:border-blue-400">
                            ${skillOpts}
                        </select>
                    </div>
                    
                    <div class="space-y-2 text-sm mt-auto">
                        <div class="flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-700">
                            <div class="flex flex-col">
                                <span>HP: <span class="font-bold text-green-400">${totalHp}</span></span>
                                <span class="text-[10px] text-gray-500">総ｺｽﾄ:${totalHpCost} / 次:${nextHpCost}pt</span>
                            </div>
                            <div class="flex items-center">
                                <button onclick="addStat(${i}, 'hp', -1)" class="bg-gray-600 hover:bg-gray-500 w-8 h-8 rounded text-lg leading-none">-</button>
                                <span class="text-xs text-gray-400 w-8 text-center">+${u.hpLvl}</span>
                                <button onclick="addStat(${i}, 'hp', 1)" class="bg-gray-600 hover:bg-gray-500 w-8 h-8 rounded text-lg leading-none ${remain < nextHpCost ? 'opacity-30 cursor-not-allowed' : ''}">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-700">
                            <div class="flex flex-col">
                                <span>攻撃: <span class="font-bold text-red-400">${totalAtk}</span></span>
                                <span class="text-[10px] text-gray-500">総ｺｽﾄ:${totalAtkCost} / 次:${nextAtkCost}pt</span>
                            </div>
                            <div class="flex items-center">
                                <button onclick="addStat(${i}, 'atk', -1)" class="bg-gray-600 hover:bg-gray-500 w-8 h-8 rounded text-lg leading-none">-</button>
                                <span class="text-xs text-gray-400 w-8 text-center">+${u.atkLvl}</span>
                                <button onclick="addStat(${i}, 'atk', 1)" class="bg-gray-600 hover:bg-gray-500 w-8 h-8 rounded text-lg leading-none ${remain < nextAtkCost ? 'opacity-30 cursor-not-allowed' : ''}">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-700">
                            <div class="flex flex-col">
                                <span>防御: <span class="font-bold text-blue-400">${totalDef}</span></span>
                                <span class="text-[10px] text-gray-500">総ｺｽﾄ:${totalDefCost} / 次:${nextDefCost}pt</span>
                            </div>
                            <div class="flex items-center">
                                <button onclick="addStat(${i}, 'def', -1)" class="bg-gray-600 hover:bg-gray-500 w-8 h-8 rounded text-lg leading-none">-</button>
                                <span class="text-xs text-gray-400 w-8 text-center">+${u.defLvl}</span>
                                <button onclick="addStat(${i}, 'def', 1)" class="bg-gray-600 hover:bg-gray-500 w-8 h-8 rounded text-lg leading-none ${remain < nextDefCost ? 'opacity-30 cursor-not-allowed' : ''}">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // --- ゲーム用クラスとデータ ---
    class Unit {
        constructor(id, team, type, x, y, name, weaponRank, skill) {
            this.id = id; this.team = team; this.type = type;
            this.x = x; this.y = y; this.name = name;
            this.weaponRank = weaponRank; this.skill = skill;
            this.mov = 2; this.rng = 1; this.isDead = false;
        }
        get icon() { return WEAPON_DATA[this.type].icon; }
    }

    function generatePlayerUnits() {
        return playerUnits.map((pu, i) => {
            let ys = [1, 3, 5];
            let u = new Unit(`B${i+1}`, 'blue', pu.weaponType, 1, ys[i], pu.name, pu.weaponRank, pu.skill);
            u.maxHp = BASE_HP + (pu.hpLvl * 2); u.hp = u.maxHp;
            u.atk = BASE_ATK + pu.atkLvl + RANK_DATA[pu.weaponRank].atk;
            u.def = BASE_DEF + pu.defLvl;
            return u;
        });
    }

    function generateEnemyUnits() {
        // 赤軍の調整: コスト増大化に合わせて少しマイルドにしつつコンセプト維持
        let e1 = new Unit('R1', 'red', 'axe', 5, 1, '赤の猛将', 'steel', 'sol'); // エース
        e1.maxHp = BASE_HP + 16; e1.hp = e1.maxHp;
        e1.atk = BASE_ATK + 6 + RANK_DATA['steel'].atk; e1.def = BASE_DEF + 3;
        
        let e2 = new Unit('R2', 'red', 'sword', 6, 3, '赤の暗殺者', 'killer', 'vantage'); // 遊撃
        e2.maxHp = BASE_HP + 6; e2.hp = e2.maxHp;
        e2.atk = BASE_ATK + 5 + RANK_DATA['killer'].atk; e2.def = BASE_DEF + 1;

        let e3 = new Unit('R3', 'red', 'lance', 5, 5, '赤の重装兵', 'iron', 'pavise'); // 壁
        e3.maxHp = BASE_HP + 10; e3.hp = e3.maxHp;
        e3.atk = BASE_ATK + 0 + RANK_DATA['iron'].atk; e3.def = BASE_DEF + 9; // 防御重視

        return [e1, e2, e3];
    }

    function getTriangleAdvantage(atkType, defType) {
        if (atkType === 'sword' && defType === 'axe') return 1;
        if (atkType === 'axe' && defType === 'lance') return 1;
        if (atkType === 'lance' && defType === 'sword') return 1;
        if (atkType === 'axe' && defType === 'sword') return -1;
        if (atkType === 'lance' && defType === 'axe') return -1;
        if (atkType === 'sword' && defType === 'lance') return -1;
        return 0;
    }

    // --- UI描画 (戦闘) ---
    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${x}-${y}`;
                const u = units.find(u => u.x === x && u.y === y && !u.isDead);
                if (u) {
                    const uDiv = document.createElement('div');
                    uDiv.className = `unit unit-${u.team}`;
                    uDiv.id = `unit-ui-${u.id}`;
                    uDiv.innerHTML = u.icon;
                    
                    const hpPer = Math.max(0, (u.hp / u.maxHp) * 100);
                    uDiv.innerHTML += `
                        <div class="hp-bar-container">
                            <div class="hp-bar" style="width: ${hpPer}%; background-color: ${hpPer<30?'#e53e3e':hpPer<60?'#d69e2e':'#48bb78'};"></div>
                        </div>`;
                    cell.appendChild(uDiv);
                }
                board.appendChild(cell);
            }
        }
    }

    function addLog(msg, imp = false) {
        const panel = document.getElementById('log-panel');
        panel.innerHTML += `<p class="${imp?'text-yellow-300 font-bold':''}">${msg}</p>`;
        panel.scrollTop = panel.scrollHeight;
    }
    
    function showTextEffect(unit, text, typeClass) {
        const cell = document.getElementById(`cell-${unit.x}-${unit.y}`);
        if (!cell) return;
        const el = document.createElement('div');
        el.className = `damage-text ${typeClass}`;
        el.innerHTML = text;
        cell.appendChild(el);
        setTimeout(() => { if(cell.contains(el)) cell.removeChild(el); }, 1000);
    }

    // --- 戦闘・AIロジック ---
    function getDistance(x1, y1, x2, y2) { return Math.abs(x1 - x2) + Math.abs(y1 - y2); }
    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function getMoveArea(unit) {
        let visited = new Set();
        let queue = [{x: unit.x, y: unit.y, dist: 0}];
        visited.add(`${unit.x},${unit.y}`);
        let area = [{x: unit.x, y: unit.y}];

        while (queue.length > 0) {
            let curr = queue.shift();
            if (curr.dist >= unit.mov) continue;
            let dirs = [[1,0], [-1,0], [0,1], [0,-1]];
            for (let [dx, dy] of dirs) {
                let nx = curr.x + dx, ny = curr.y + dy;
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                    let key = `${nx},${ny}`;
                    if (!visited.has(key) && !units.find(u => u.x === nx && u.y === ny && !u.isDead)) {
                        visited.add(key);
                        queue.push({x: nx, y: ny, dist: curr.dist + 1});
                        area.push({x: nx, y: ny});
                    }
                }
            }
        }
        return area;
    }

    async function executeAITurn(unit) {
        if (unit.isDead || !isPlaying) return;
        renderBoard();
        const uUI = document.getElementById(`unit-ui-${unit.id}`);
        if(uUI) uUI.classList.add('active');
        await sleep(SLEEP_MS / 2);

        const enemies = units.filter(u => u.team !== unit.team && !u.isDead);
        if (enemies.length === 0) return;

        let target = enemies.find(e => getDistance(unit.x, unit.y, e.x, e.y) <= unit.rng);
        
        if (!target) {
            let closest = null, minDist = Infinity;
            enemies.forEach(e => {
                let d = getDistance(unit.x, unit.y, e.x, e.y);
                if (d < minDist) { minDist = d; closest = e; }
            });

            if (closest) {
                const area = getMoveArea(unit);
                let best = {x: unit.x, y: unit.y}, bestD = getDistance(unit.x, unit.y, closest.x, closest.y);
                for (let pos of area) {
                    let d = getDistance(pos.x, pos.y, closest.x, closest.y);
                    if (d <= unit.rng) { best = pos; break; }
                    if (d < bestD) { bestD = d; best = pos; }
                }
                if (best.x !== unit.x || best.y !== unit.y) {
                    unit.x = best.x; unit.y = best.y;
                    renderBoard();
                    const cell = document.getElementById(`cell-${unit.x}-${unit.y}`);
                    if(cell) { cell.classList.add('move-target'); await sleep(SLEEP_MS); cell.classList.remove('move-target'); }
                    target = enemies.find(e => getDistance(unit.x, unit.y, e.x, e.y) <= unit.rng);
                }
            }
        }

        if (target) {
            await executeBattle(unit, target);
        } else {
            addLog(`${unit.name} は待機した。`);
        }

        if(uUI) uUI.classList.remove('active');
        await sleep(SLEEP_MS / 2);
    }

    async function executeBattle(initiator, target) {
        const tCell = document.getElementById(`cell-${target.x}-${target.y}`);
        if(tCell) tCell.classList.add('attack-target');
        await sleep(SLEEP_MS / 2);

        let first = initiator;
        let second = target;
        let canCounter = getDistance(first.x, first.y, second.x, second.y) <= second.rng;

        if (canCounter && second.skill === 'vantage') {
            addLog(`⚡ ${second.name}の【待ち伏せ】！先制攻撃！`, true);
            first = target; second = initiator;
        }

        await performStrike(first, second);
        if (second.isDead) return endBattle(tCell);

        if (first.weaponRank === 'brave') {
            await performStrike(first, second);
            if (second.isDead) return endBattle(tCell);
        }

        if (canCounter) {
            await performStrike(second, first);
            if (first.isDead) return endBattle(tCell);

            if (second.weaponRank === 'brave') {
                await performStrike(second, first);
            }
        }

        function endBattle(cell) { if(cell) cell.classList.remove('attack-target'); }
        endBattle(tCell);
    }

    async function performStrike(atkU, defU) {
        let bonusDmg = 0;
        let targetDef = defU.def;
        let cNameAtk = atkU.team==='blue'?'text-blue-400':'text-red-400';
        let cNameDef = defU.team==='blue'?'text-blue-400':'text-red-400';

        // 怒り
        if (atkU.skill === 'wrath' && atkU.hp <= atkU.maxHp / 2) {
            bonusDmg += 5; addLog(`💢 <span class="${cNameAtk}">${atkU.name}</span>の【怒り】! (威力+5)`);
        }

        // キラー(30%で必殺) - 防御7割減（つまり相手の防御を0.3倍にして計算）
        let isCrit = false;
        if (atkU.weaponRank === 'killer' && Math.random() < 0.3) {
            isCrit = true; 
            targetDef = Math.floor(targetDef * 0.3);
        }

        // 相性
        const adv = getTriangleAdvantage(atkU.type, defU.type);
        let atkMod = 0, advT = "";
        if (adv === 1) { atkMod = 3; advT = "<span class='text-green-400'>(有利)</span>"; }
        if (adv === -1) { atkMod = -3; advT = "<span class='text-red-400'>(不利)</span>"; }

        // 大盾(30%で半減)
        let isPavise = false;
        if (defU.skill === 'pavise' && Math.random() < 0.3) {
            isPavise = true; addLog(`🛡️ <span class="${cNameDef}">${defU.name}</span>の【大盾】! (ダメージ半減)`);
        }

        // ダメージ計算
        let rawDmg = Math.max(1, (atkU.atk + atkMod + bonusDmg) - targetDef);
        let dmg = rawDmg;
        if (isPavise) dmg = Math.floor(dmg / 2);
        if (dmg < 1) dmg = 1;

        defU.hp -= dmg;
        
        let critT = isCrit ? "<span class='text-yellow-400 font-bold'>【必殺!防貫通】</span>" : "";
        addLog(`<span class="${cNameAtk}">${atkU.name}</span>の攻撃! ${critT} ➔ <span class="${cNameDef}">${defU.name}</span>に ${dmg} ダメージ ${advT}`);
        
        showTextEffect(defU, isCrit ? `CRIT! -${dmg}` : `-${dmg}`, isCrit ? 'text-crit' : 'text-dmg');
        renderBoard();
        await sleep(SLEEP_MS);

        // 太陽
        if (atkU.skill === 'sol' && dmg > 0) {
            let heal = Math.ceil(dmg / 2);
            atkU.hp = Math.min(atkU.maxHp, atkU.hp + heal);
            addLog(`☀️ <span class="${cNameAtk}">${atkU.name}</span>の【太陽】! (HP ${heal} 回復)`);
            showTextEffect(atkU, `+${heal}`, 'text-heal');
            renderBoard();
            await sleep(SLEEP_MS/2);
        }

        if (defU.hp <= 0) {
            defU.hp = 0; defU.isDead = true;
            addLog(`☠️ <span class="${cNameDef}">${defU.name}</span> は倒れた！`, true);
            renderBoard();
        }
    }

    function checkWin() {
        const blueA = units.filter(u => u.team === 'blue' && !u.isDead).length;
        const redA = units.filter(u => u.team === 'red' && !u.isDead).length;
        const status = document.getElementById('status-text');

        if (blueA === 0 && redA === 0) {
            status.innerText = "引き分け！両軍全滅..."; isPlaying = false;
        } else if (blueA === 0) {
            status.innerText = "敗北... 敵軍の勝利"; addLog("🔴 敵軍が勝利しました...", true); isPlaying = false;
        } else if (redA === 0) {
            status.innerText = "勝利！ 敵将を討ち取った！"; addLog("🔵 自軍が勝利しました！", true); isPlaying = false;
        }

        if (!isPlaying) {
            document.getElementById('result-controls').classList.remove('hidden');
            return true;
        }
        return false;
    }

    async function gameLoop() {
        while (isPlaying) {
            document.getElementById('status-text').innerText = `ターン ${turnCount} - 自軍フェイズ`;
            for (let u of units.filter(u => u.team === 'blue' && !u.isDead)) {
                if(!isPlaying) break; await executeAITurn(u); if (checkWin()) break;
            }
            if (!isPlaying) break; await sleep(SLEEP_MS);

            document.getElementById('status-text').innerText = `ターン ${turnCount} - 敵軍フェイズ`;
            for (let u of units.filter(u => u.team === 'red' && !u.isDead)) {
                if(!isPlaying) break; await executeAITurn(u); if (checkWin()) break;
            }
            if (!isPlaying) break;
            turnCount++; await sleep(SLEEP_MS);
        }
    }

    function startGame() {
        if (calculateTotalCost() > MAX_COST) { alert("コストが上限を超えています！"); return; }
        
        document.getElementById('prep-screen').classList.add('hidden');
        document.getElementById('battle-screen').classList.remove('hidden');
        document.getElementById('result-controls').classList.add('hidden');
        
        units = [...generatePlayerUnits(), ...generateEnemyUnits()];
        isPlaying = true; turnCount = 1;
        document.getElementById('log-panel').innerHTML = '';
        document.getElementById('status-text').innerText = "戦闘準備完了";
        addLog("⚔️ 戦闘開始！", true);
        
        renderBoard();
        gameLoop();
    }

    function returnToPrep() {
        document.getElementById('battle-screen').classList.add('hidden');
        document.getElementById('prep-screen').classList.remove('hidden');
    }

    renderPrepUI();
</script>
